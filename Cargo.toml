[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/u-king/uenv"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
thiserror = "2"
winreg = "0.55"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
